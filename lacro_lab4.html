<!DOCTYPE html>


<style>

body{
background-color: black;
justify-content: center;
display: flex;
}

.board{
border: 4px solid black;
margin: 60px;
width: 320px;
height: 320px; 
background-color: blue;
backdrop-filter: blur(20px);
border-radius: 15px;
box-shadow: 0 10px 15px;
}

.board{
display: grid;
background-color: yellow;
grid-template-columns: 1fr 1fr 1fr;
gap: 5px;
border-radius: 15px;
}


.cell{
border:  2px solid black;
background-color: black;
border-radius: 2px;
width: 100px;
height: 100px;
font-size: 24px;
}

.cell:hover{
transform(2);
background-color: pink;
}

.new{
background-color: grey;
width: 35dvw;
height: 80dvh; 
display: flex;
flex-direction: column;
align-items: center;
border-radius: 15px;
}

.Reset{
background-color: pink;
border-radius: 15px;
box-shadow: 0 10px 15px;
width: 60px;
height: 40px;
}

.Reset:hover{
background-color: red;
}

form{
margin: 150px auto;
}


</style>

<body>
<div class = "new">
<h1> TIK TEK TOH </h1>
<p> Current Player = X</p>
<div class = "board">
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
<div class = "cell"></div>
</div>
<button class = "Reset">Reset</button>
</div>

</body>
</html>
